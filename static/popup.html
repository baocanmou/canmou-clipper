<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<title>参谋剪藏</title>
	<link rel="stylesheet" href="ui.css">
</head>
<body class="popup">
	<header>
		<strong>参谋剪藏</strong>
		<button id="settings" class="link" type="button">设置</button>
	</header>

	<label for="title">标题</label>
	<input id="title" type="text" spellcheck="false">

	<label for="folder">存到</label>
	<select id="folder"></select>
	<p id="hint" class="hint"></p>

	<label>标签</label>
	<div id="tags" class="chips"></div>
	<span id="value" class="badge" hidden></span>

	<button id="save" class="primary" type="button" disabled>存入 Obsidian</button>
	<div class="row">
		<button id="reader" type="button" disabled>阅读模式</button>
		<button id="copy" type="button" disabled>复制 Markdown</button>
	</div>
	<p id="status" class="status"></p>

	<script src="popup.js"></script>
</body>
</html>
